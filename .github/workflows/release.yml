name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        registry-url: 'https://registry.npmjs.org'

    - run: npm ci
    - run: npm run build
    
    - name: Publish @sorodoc/core
      run: npm publish --workspace=@sorodoc/core
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Publish @sorodoc/sdk
      run: npm publish --workspace=@sorodoc/sdk
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Publish @sorodoc/cli
      run: npm publish --workspace=@sorodoc/cli
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
