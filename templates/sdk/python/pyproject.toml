[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sorodoc-{{PACKAGE_NAME}}-sdk"
version = "{{VERSION}}"
description = "Python SDK for {{CONTRACT_NAME}} — generated by SoroDoc"
requires-python = ">=3.10"
dependencies = [
    "stellar-sdk>=11.0.0",
]

[project.urls]
homepage = "https://sorodoc.dev"
