version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-dev-secret}
      - PORT=3001
      - HOST=0.0.0.0
      - POSTGRES_URL=${POSTGRES_URL:-postgresql://sorodoc:sorodoc@postgres:5432/sorodoc}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: npx tsx watch packages/api/src/server.ts

  cli:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
    entrypoint: ["node", "packages/cli/dist/index.js"]
    profiles:
      - cli

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sorodoc
      POSTGRES_PASSWORD: sorodoc
      POSTGRES_DB: sorodoc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorodoc"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
