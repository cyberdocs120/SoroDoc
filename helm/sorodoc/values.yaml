replicaCount: 1

image:
  repository: sorodoc/api
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: api.sorodoc.io
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}

env:
  NODE_ENV: "production"
  PORT: "3001"

secrets:
  anthropicApiKey: ""
  jwtSecret: "change-me-in-production"
  databaseUrl: "postgres://sorodoc:sorodoc@postgres:5432/sorodoc"
  redisUrl: "redis://redis:6379"
